apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ora-rbd2
spec:
  serviceName: ora-rbd2-service
  selector:
    matchLabels:
      app: ora-rbd2
  replicas: 1
  template:
    metadata:
      labels:
        app: ora-rbd2
    spec:
      containers:
        - name: ora-rbd2
          image: container-registry.oracle.com/database/express:latest
          volumeMounts:
            - name: ora-rbd2-disk
              mountPath: /opt/oracle/oradata
          env:
            - name: ORACLE_PWD
              value: rbd2
  volumeClaimTemplates:
    - metadata:
        name: ora-rbd2-disk
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ora-rbd2-lb
spec:
  type: LoadBalancer
  ports:
  - port: 1522
    targetPort: 1521
  selector:
    app: ora-rbd2
