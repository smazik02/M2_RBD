apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgsql-rbd3
spec:
  serviceName: pgsql-rbd3-service
  selector:
    matchLabels:
      app: pgsql-rbd3
  replicas: 1
  template:
    metadata:
      labels:
        app: pgsql-rbd3
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-rbdcluster-agent-1
      containers:
        - name: pgsql-rbd3
          image: postgres:18.0-trixie
          volumeMounts:
            - name: pgsql-rbd3-disk
              mountPath: /data
          env:
            - name: POSTGRES_PASSWORD
              value: rbd3
            - name: PGDATA
              value: /data/pgdata
  volumeClaimTemplates:
    - metadata:
        name: pgsql-rbd3-disk
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 25Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgsql-rbd3-lb
spec:
  type: LoadBalancer
  ports:
  - port: 5434
    targetPort: 5432
  selector:
    app: pgsql-rbd3
